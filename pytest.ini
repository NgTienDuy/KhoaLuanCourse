[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    slow: marks tests that take >5s (deselect with '-m "not slow"')
    gpu: marks tests requiring CUDA
    integration: marks end-to-end integration tests
filterwarnings =
    ignore::DeprecationWarning:torch.*
    ignore::UserWarning:torch.*
